<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>Favorit Saya — PRELOVEDU</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/css/tokens.css" />
  <link rel="stylesheet" href="../assets/css/base.css" />
  <link rel="stylesheet" href="../assets/css/components.css" />
  <link rel="stylesheet" href="../assets/css/pages.css" />
</head>
<body>

  <!-- Top Header Mount -->
  <div id="header-mount"></div>

  <main class="app-container" style="padding-top: 1.5rem; max-width: 860px;">
    <!-- Header Halaman Favorit -->
    <div class="d-flex align-items-center justify-content-between mb-4">
      <div class="d-flex align-items-center gap-3">
        <a href="../index.html" class="btn-circle btn-circle-white" aria-label="Kembali ke Beranda">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
        </a>
        <h1 class="hero-title" style="font-size: 1.8rem; margin-bottom: 0;">Favorit Saya</h1>
      </div>
      <span id="fav-count-badge" class="badge-pill badge-pill-lilac">0 Barang Tersimpan</span>
    </div>

    <!-- Daftar Produk Favorit -->
    <div id="favorites-list" class="d-flex flex-column gap-3 mb-4">
      <!-- Loading Skeleton -->
      <div class="skeleton-box" style="height: 120px; border-radius: var(--radius-card);"></div>
      <div class="skeleton-box" style="height: 120px; border-radius: var(--radius-card);"></div>
    </div>

    <!-- Tombol Jelajahi Lagi -->
    <div class="text-center pt-2 pb-5">
      <a href="../index.html" class="btn-pill btn-pill-lime">
        <span>Telusuri Katalog Lainnya</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      </a>
    </div>
  </main>

  <!-- Bottom Navigation Mount -->
  <div id="bottom-nav-mount"></div>

  <script type="module">
    import { renderHeader, renderBottomNav, showToast } from '../assets/js/components/navbar.js';
    import { renderFavicon } from '../assets/js/components/logo.js';
    import { getFavorites, getProducts, toggleFavorite } from '../assets/js/services/storage.js';
    import { formatRupiah } from '../assets/js/components/product-card.js';
    import { icons } from '../assets/js/components/icons.js';

    function init() {
      // Favicon
      const linkFavicon = document.createElement('link');
      linkFavicon.rel = 'icon';
      linkFavicon.type = 'image/svg+xml';
      linkFavicon.href = renderFavicon();
      document.head.appendChild(linkFavicon);

      // Render Navs
      document.getElementById('header-mount').innerHTML = renderHeader('favorit', '../');
      document.getElementById('bottom-nav-mount').innerHTML = renderBottomNav('favorit', '../');

      renderFavoriteItems();
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }

    function renderFavoriteItems() {
      const container = document.getElementById('favorites-list');
      const countBadge = document.getElementById('fav-count-badge');
      const favIds = getFavorites();
      const allProducts = getProducts();
      const favProducts = allProducts.filter(p => favIds.includes(p.id));

      if (countBadge) {
        countBadge.textContent = `${favProducts.length} Barang Tersimpan`;
      }

      if (favProducts.length === 0) {
        container.innerHTML = `
          <div class="empty-state-card">
            <div class="empty-state-icon" style="color:var(--heart-red);">
              ${icons.heart(32, 2.5, false)}
            </div>
            <h3 style="font-family:var(--font-serif); font-size:1.35rem; margin-bottom:0.5rem;">Belum Ada Barang Favorit</h3>
            <p style="color:var(--ink-muted); font-size:0.9rem; margin-bottom:1.5rem;">
              Simpan barang-barang yang kamu taksir dengan menekan ikon hati di katalog agar mudah dipantau.
            </p>
            <a href="../index.html" class="btn-pill btn-pill-lime">
              Mulai Eksplorasi
            </a>
          </div>
        `;
        return;
      }

      container.innerHTML = favProducts.map(item => `
        <article class="featured-card" style="margin-bottom:0;" data-id="${item.id}">
          <div class="featured-card-media" style="width:130px; min-height:120px; padding:0.75rem;">
            <img src="../${item.images[0]}" alt="${item.title}" style="max-height:85px;" />
          </div>
          <div class="featured-card-content" style="padding:1rem 1.25rem;">
            <div class="d-flex justify-content-between align-items-start gap-2">
              <div>
                <span class="badge-pill badge-pill-lime" style="font-size:0.72rem; padding:0.2rem 0.6rem; margin-bottom:0.35rem;">
                  ${item.conditionBadge || item.condition}
                </span>
                <h3 class="product-title" style="font-size:1.15rem; min-height:auto; margin-bottom:0.35rem;">
                  <a href="detail.html?id=${item.id}">${item.title}</a>
                </h3>
                <div style="font-size:0.8rem; color:var(--ink-muted);">Penjual: ${item.seller.name} (${item.faculty})</div>
              </div>

              <!-- Tombol Hapus dari Favorit -->
              <button type="button" class="btn-circle btn-circle-white btn-remove-fav" data-id="${item.id}" aria-label="Hapus dari favorit" title="Hapus dari favorit">
                ${icons.x(18, 2.5)}
              </button>
            </div>

            <div class="d-flex align-items-center justify-content-between mt-3 pt-2" style="border-top:1.5px dashed rgba(42,42,42,0.15);">
              <div class="product-price-val" style="font-size:1.35rem;">${formatRupiah(item.price)}</div>
              <a href="detail.html?id=${item.id}" class="btn-pill btn-pill-lime" style="min-height:38px; padding:0.4rem 1.15rem; font-size:0.88rem;">
                Tawar Sekarang
              </a>
            </div>
          </div>
        </article>
      `).join('');

      // Listener tombol hapus
      container.querySelectorAll('.btn-remove-fav').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-id');
          toggleFavorite(id);
          showToast('Barang dihapus dari daftar Favorit');
          renderFavoriteItems();
        });
      });
    }
  </script>
</body>
</html>
