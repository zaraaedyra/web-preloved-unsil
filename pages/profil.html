<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>Profil Saya — PRELOVEDU</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/css/tokens.css" />
  <link rel="stylesheet" href="../assets/css/base.css" />
  <link rel="stylesheet" href="../assets/css/components.css" />
  <link rel="stylesheet" href="../assets/css/pages.css" />
</head>
<body>

  <!-- Top Header Mount -->
  <div id="header-mount"></div>

  <main class="app-container" style="padding-top: 1.5rem; padding-bottom: 6rem; max-width: 680px;">
    <section class="card p-4 p-md-5 mb-4" aria-labelledby="user-display-name" style="border: var(--border-thick); border-radius: var(--radius-card); background: #fff; box-shadow: var(--shadow-flat);">
      <div class="d-flex align-items-center gap-3">
        <div class="avatar-circle" id="user-display-avatar" aria-hidden="true" style="width: 70px; height: 70px; font-size: 1.5rem; background: var(--lilac);">G</div>
        <div>
          <p class="mb-1" style="font-size:0.72rem; font-weight:800; letter-spacing:0.1em; color:var(--ink-muted);">STATUS AKUN</p>
          <h1 class="hero-title" id="user-display-name" style="font-size:1.5rem; margin-bottom:0.35rem;">GUEST</h1>
          <div class="d-flex flex-wrap align-items-center gap-2">
            <span class="badge-pill badge-pill-lilac" id="badge-ktm-status">GUEST</span>
            <span id="user-display-email" style="font-size:0.82rem; color:var(--ink-muted);">Email akun belum tersedia.</span>
          </div>
        </div>
      </div>

      <div class="mt-4 p-3" role="status" style="background:var(--paper); border:1.5px solid rgba(42,42,42,0.12); border-radius:var(--radius-inner);">
        <h2 style="font-family:var(--font-serif); font-size:1.15rem; margin-bottom:0.4rem;">Anda sedang menjelajah sebagai tamu</h2>
        <p class="mb-0" style="font-size:0.88rem; color:var(--ink-muted);">Profil dan verifikasi KTM belum tersedia. Status tamu ini hanya untuk tampilan dan tidak memberikan proteksi akses.</p>
      </div>

      <a href="login.html" class="btn-pill btn-pill-lime w-100 mt-3" aria-label="Masuk atau daftar">Masuk / Daftar</a>
    </section>

    <section class="card p-4 mb-5" aria-labelledby="profile-links-heading" style="border:var(--border-thick); border-radius:var(--radius-card); background:#fff; box-shadow:var(--shadow-flat);">
      <h2 id="profile-links-heading" style="font-family:var(--font-serif); font-size:1.2rem;">Jelajahi PRELOVEDU</h2>
      <div class="d-flex flex-column gap-2 mt-3">
        <a href="tawaran.html" class="btn-pill btn-pill-outline justify-content-between"><span>Daftar Tawaran</span><span aria-hidden="true">→</span></a>
        <a href="favorit.html" class="btn-pill btn-pill-outline justify-content-between"><span>Barang Favorit</span><span aria-hidden="true">→</span></a>
        <a href="../index.html" class="btn-pill btn-pill-outline justify-content-between"><span>Kembali ke Beranda</span><span aria-hidden="true">→</span></a>
      </div>
    </section>
  </main>

  <!-- Bottom Nav Mount -->
  <div id="bottom-nav-mount"></div>

  <script type="module">
    import { renderHeader, renderBottomNav } from '../assets/js/components/navbar.js';
    import { renderFavicon } from '../assets/js/components/logo.js';
    import { getCurrentUser } from '../assets/js/services/storage.js';

    document.addEventListener('DOMContentLoaded', () => {
      // Favicon
      const linkFavicon = document.createElement('link');
      linkFavicon.rel = 'icon';
      linkFavicon.type = 'image/svg+xml';
      linkFavicon.href = renderFavicon();
      document.head.appendChild(linkFavicon);

      // Render Navs
      document.getElementById('header-mount').innerHTML = renderHeader('profil', '../');
      document.getElementById('bottom-nav-mount').innerHTML = renderBottomNav('profil', '../');

      const user = getCurrentUser();
      const isGuest = !user.isLoggedIn;
      document.getElementById('user-display-name').textContent = isGuest ? 'GUEST' : user.name;
      document.getElementById('user-display-avatar').textContent = isGuest ? 'G' : (user.avatar || 'M');
      document.getElementById('user-display-email').textContent = isGuest ? 'Email akun belum tersedia.' : user.email;
      document.getElementById('badge-ktm-status').textContent = isGuest ? 'GUEST' : (user.isVerified ? 'KTM Terverifikasi' : 'Belum Terverifikasi');
    });
  </script>
</body>
</html>
