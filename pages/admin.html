<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <meta name="description" content="Admin Portal PRELOVEDU." />
  <title>Admin Portal — PRELOVEDU</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/css/tokens.css" />
  <link rel="stylesheet" href="../assets/css/base.css" />
  <link rel="stylesheet" href="../assets/css/components.css" />
  <link rel="stylesheet" href="../assets/css/pages.css" />
</head>
<body>
  <div id="header-mount"></div>

  <main class="app-container">
    <section class="p-4 p-md-5" style="max-width: 760px; margin: clamp(3rem, 8vw, 6rem) auto; background: var(--white); border: var(--border-thick); border-radius: var(--radius-card); box-shadow: var(--shadow-soft);">
      <span class="badge-pill badge-pill-lilac">Admin Portal</span>
      <h1 class="mt-3" style="font-family: var(--font-serif); font-size: clamp(2rem, 5vw, 3rem);">Area admin belum diaktifkan</h1>
      <p style="max-width: 58ch; color: var(--ink-muted); line-height: 1.65;">
        Halaman ini sudah tersedia sebagai tujuan navigasi. Fitur pengelolaan admin memerlukan autentikasi dan backend yang aman, sehingga belum dapat digunakan pada versi ini.
      </p>
      <a href="../index.html" class="btn-pill btn-pill-ink mt-2">Kembali ke Beranda</a>
    </section>
  </main>

  <div id="bottom-nav-mount"></div>

  <script type="module">
    import { renderHeader, renderBottomNav } from '../assets/js/components/navbar.js';
    import { renderFavicon } from '../assets/js/components/logo.js';

    document.getElementById('header-mount').innerHTML = renderHeader('admin', '../');
    document.getElementById('bottom-nav-mount').innerHTML = renderBottomNav('home', '../');

    const favicon = document.createElement('link');
    favicon.rel = 'icon';
    favicon.type = 'image/svg+xml';
    favicon.href = renderFavicon();
    document.head.appendChild(favicon);
  </script>
</body>
</html>
