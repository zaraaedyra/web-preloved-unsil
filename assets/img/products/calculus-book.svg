<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <linearGradient id="bookCover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E5A77"/>
      <stop offset="100%" stop-color="#073344"/>
    </linearGradient>
  </defs>
  <!-- Book spine & body -->
  <rect x="35" y="25" width="90" height="110" rx="6" fill="#F4EBD9" stroke="#2A2A2A" stroke-width="3"/>
  <rect x="30" y="20" width="90" height="112" rx="6" fill="url(#bookCover)" stroke="#2A2A2A" stroke-width="3.5"/>
  <!-- Spine stripe -->
  <rect x="30" y="20" width="14" height="112" rx="4" fill="#C9F26B" stroke="#2A2A2A" stroke-width="2.5"/>
  <!-- Book Title simulation -->
  <rect x="52" y="38" width="58" height="10" rx="3" fill="#FFF"/>
  <rect x="52" y="54" width="42" height="6" rx="2" fill="#C9F26B"/>
  <path d="M 52 75 Q 75 60 98 85 T 115 80" stroke="#FFF" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Integral symbol -->
  <text x="65" y="112" font-family="serif" font-size="28" font-style="italic" fill="#E9C6EA" font-weight="bold">∫</text>
  <text x="80" y="110" font-family="sans-serif" font-size="10" fill="#FFF" font-weight="bold">dx</text>
</svg>